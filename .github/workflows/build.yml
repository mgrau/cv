name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Cache TinyTeX packages
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ hashFiles('**/*.sty', '**/*.qmd', '_quarto.yml') }}
          restore-keys: tinytex-

      - name: Install LaTeX packages
        run: |
          export PATH="$HOME/.TinyTeX/bin/$(uname -m)-linux:$PATH"
          tlmgr update --self
          tlmgr install \
            curve cochineal cabin inconsolata fontawesome5 simpleicons \
            fontspec luaotfload unicode-math lualatex-math lm-math carlito tex-gyre \
            biblatex-phys biber silence relsize fancyhdr lastpage \
            csquotes xpatch comment multirow pgf \
            etoolbox microtype caption float bookmark xurl \
            footnotehyper booktabs iftex parskip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-py3.12-scholarly
          restore-keys: venv-py3.12-

      - name: Install Python dependencies
        run: |
          uv venv --clear .venv
          uv pip install scholarly --python .venv/bin/python

      # Quarto resolves {{< include >}} directives while enumerating project
      # input files, which happens BEFORE pre-render scripts run. On a clean
      # checkout generated/ does not exist yet, so the includes fail. Generate
      # it up front; the pre-render hooks then re-run these idempotently.
      - name: Generate sections
        env:
          CV_SCHOLAR_DISABLE: '1'
        run: make generate

      - name: Build CV
        env:
          CV_SCHOLAR_DISABLE: '1'
        run: quarto render

      - name: Generate index page
        run: |
          python3 - << 'EOF'
          import os
          from pathlib import Path

          pdfs = sorted(Path("_build").glob("*.pdf"))
          items = "\n".join(
              f'      <li><a href="{p.name}">{p.stem}</a></li>'
              for p in pdfs
          )
          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Matt Grau — CV</title>
            <style>
              body {{ font-family: Georgia, serif; max-width: 600px; margin: 4em auto; padding: 0 1em; color: #222; }}
              h1 {{ font-size: 1.6em; margin-bottom: 0.2em; }}
              p {{ color: #555; margin-top: 0; }}
              ul {{ list-style: none; padding: 0; margin-top: 2em; }}
              li {{ margin: 0.8em 0; }}
              a {{ color: #057f8c; text-decoration: none; font-size: 1.1em; }}
              a:hover {{ text-decoration: underline; }}
            </style>
          </head>
          <body>
            <h1>Matt Grau</h1>
            <p>Old Dominion University — Physics</p>
            <ul>
          {items}
            </ul>
          </body>
          </html>
          """
          Path("_build/index.html").write_text(html)
          EOF

      - name: Upload PDFs to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Publish PDFs as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          body: "Built from commit ${{ github.sha }}"
          files: _build/*.pdf

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: "*.log"
          retention-days: 7
