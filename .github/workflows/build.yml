name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Cache TinyTeX packages
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ hashFiles('**/*.sty', '**/*.qmd', '_quarto.yml') }}
          restore-keys: tinytex-

      - name: Install LaTeX packages
        run: |
          export PATH="$HOME/.TinyTeX/bin/$(uname -m)-linux:$PATH"
          tlmgr update --self
          tlmgr install \
            curve cochineal cabin inconsolata fontawesome5 simpleicons \
            biblatex-phys biber silence relsize fancyhdr lastpage \
            csquotes xpatch comment multirow pgf \
            etoolbox microtype caption float bookmark xurl \
            footnotehyper booktabs iftex parskip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-py3.12-scholarly
          restore-keys: venv-py3.12-

      - name: Install Python dependencies
        run: |
          uv venv --clear .venv
          uv pip install scholarly --python .venv/bin/python

      - name: Build CV
        env:
          CV_SCHOLAR_DISABLE: '1'
        run: quarto render

      - name: Upload cv-full.pdf
        uses: actions/upload-artifact@v4
        with:
          name: cv-full
          path: _build/cv-full.pdf
          retention-days: 90

      - name: Upload cv-odu.pdf
        uses: actions/upload-artifact@v4
        with:
          name: cv-odu
          path: _build/cv-odu.pdf
          retention-days: 90

      - name: Upload cv-3p.pdf
        uses: actions/upload-artifact@v4
        with:
          name: cv-3p
          path: _build/cv-3p.pdf
          retention-days: 90

      - name: Upload cv-2p.pdf
        uses: actions/upload-artifact@v4
        with:
          name: cv-2p
          path: _build/cv-2p.pdf
          retention-days: 90

      - name: Upload cv-1p.pdf
        uses: actions/upload-artifact@v4
        with:
          name: cv-1p
          path: _build/cv-1p.pdf
          retention-days: 90

      - name: Upload cv-web.pdf
        uses: actions/upload-artifact@v4
        with:
          name: cv-web
          path: _build/cv-web.pdf
          retention-days: 90

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: "*.log"
          retention-days: 7
