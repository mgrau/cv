name: Build CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Cache TinyTeX packages
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ hashFiles('**/*.sty', '**/*.qmd', '_quarto.yml') }}
          restore-keys: tinytex-

      - name: Install LaTeX packages
        run: |
          export PATH="$HOME/.TinyTeX/bin/$(uname -m)-linux:$PATH"
          tlmgr update --self
          tlmgr install \
            curve cochineal cabin inconsolata fontawesome5 simpleicons \
            fontspec luaotfload unicode-math lualatex-math lm-math carlito tex-gyre \
            biblatex-phys biber silence relsize fancyhdr lastpage \
            csquotes xpatch comment multirow pgf \
            etoolbox microtype caption float bookmark xurl \
            footnotehyper booktabs iftex parskip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-py3.12-scholarly
          restore-keys: venv-py3.12-

      - name: Install Python dependencies
        run: |
          uv venv --clear .venv
          uv pip install scholarly --python .venv/bin/python

      # Quarto resolves {{< include >}} directives while enumerating project
      # input files, which happens BEFORE pre-render scripts run. On a clean
      # checkout generated/ does not exist yet, so the includes fail. Generate
      # it up front; the pre-render hooks then re-run these idempotently.
      - name: Generate sections
        env:
          CV_SCHOLAR_DISABLE: '1'
        run: make generate

      - name: Build CV
        env:
          CV_SCHOLAR_DISABLE: '1'
        run: quarto render

      # The landing page, robots.txt and portrait live in web/. The ODU CV is
      # built and reachable by URL but deliberately not linked from the page.
      - name: Assemble site
        run: make site

      - name: Upload PDFs to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Publish PDFs as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest CV
          body: "Built from commit ${{ github.sha }}"
          files: |
            _build/cv.pdf
            _build/cv-3p.pdf
            _build/cv-2p.pdf
            _build/cv-1p.pdf
            _build/publications.pdf

      - name: Upload LaTeX logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: "*.log"
          retention-days: 7
